name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test and vet
    uses: ./.github/workflows/ci.yml

  prepare-assets:
    name: Prepare application icon
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Render application icon
        run: |
          brew install librsvg
          mkdir -p dist
          rsvg-convert --width 1024 --height 1024 --output dist/pinger.png assets/icon1.svg

      - name: Upload application icon
        uses: actions/upload-artifact@v4
        with:
          name: application-icon
          path: dist/pinger.png
          retention-days: 7

  build:
    name: Build macOS universal DMGs
    runs-on: macos-latest
    needs: [prepare-assets, test]
    env:
      # Matches the deployment target in build/darwin/Taskfile.yml and the
      # "macOS 12 or newer" support statement in the README.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Wails bindings
        shell: bash
        run: |
          GOBIN="${RUNNER_TEMP}/wails-bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          "${RUNNER_TEMP}/wails-bin/wails3" generate bindings -f '-tags sqlite_fts5,goolm' -clean=true -ts -i

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download application icon
        uses: actions/download-artifact@v4
        with:
          name: application-icon
          path: build-assets

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Build universal macOS app
        shell: bash
        run: |
          mkdir -p "dist/Pinger.app/Contents/MacOS" "dist/Pinger.app/Contents/Resources" "dist/Pinger.iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build-assets/pinger.png \
              --out "dist/Pinger.iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$double" "$double" build-assets/pinger.png \
              --out "dist/Pinger.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "dist/Pinger.iconset" \
            -o "dist/Pinger.app/Contents/Resources/AppIcon.icns"
          for arch in amd64 arm64; do
            clang_arch="$arch"
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CC="clang -arch $clang_arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -tags "sqlite_fts5 goolm" \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/pinger-${arch}" .
          done
          lipo -create dist/pinger-amd64 dist/pinger-arm64 \
            -output "dist/Pinger.app/Contents/MacOS/pinger"
          rm dist/pinger-amd64 dist/pinger-arm64
          lipo -info "dist/Pinger.app/Contents/MacOS/pinger"
          cat > "dist/Pinger.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>pinger</string>
            <key>CFBundleIdentifier</key><string>fi.mau.pinger</string>
            <key>CFBundleName</key><string>Pinger</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/Pinger.app"
          codesign --verify --deep --strict "dist/Pinger.app"

      - name: Build universal TUI binary
        shell: bash
        run: |
          for arch in amd64 arm64; do
            clang_arch="$arch"
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CC="clang -arch $clang_arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -tags "sqlite_fts5 goolm" \
              -ldflags "-s -w" \
              -o "dist/gomuks-tui-${arch}" ./cmd/gomuks-tui
          done
          lipo -create dist/gomuks-tui-amd64 dist/gomuks-tui-arm64 \
            -output dist/gomuks-tui
          rm dist/gomuks-tui-amd64 dist/gomuks-tui-arm64
          lipo -info dist/gomuks-tui

      - name: Create macOS DMGs
        shell: bash
        run: |
          set -euo pipefail
          # GUI disk image: the signed app plus an /Applications symlink so the
          # app can be dragged into place in Finder.
          gui_stage="$(mktemp -d)"
          cp -R "dist/Pinger.app" "$gui_stage/"
          ln -s /Applications "$gui_stage/Applications"
          hdiutil create \
            -volname "Pinger" \
            -srcfolder "$gui_stage" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "dist/Pinger-${VERSION}-macos-universal.dmg"
          rm -rf "$gui_stage"

          # TUI disk image: the universal binary plus a symlink into
          # /usr/local/bin so it can be dragged onto PATH in Finder.
          tui_stage="$(mktemp -d)"
          cp dist/gomuks-tui "$tui_stage/gomuks-tui"
          chmod 755 "$tui_stage/gomuks-tui"
          ln -s /usr/local/bin "$tui_stage/bin"
          hdiutil create \
            -volname "Pinger TUI" \
            -srcfolder "$tui_stage" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "dist/Pinger-TUI-${VERSION}-macos-universal.dmg"
          rm -rf "$tui_stage"

          hdiutil verify "dist/Pinger-${VERSION}-macos-universal.dmg"
          hdiutil verify "dist/Pinger-TUI-${VERSION}-macos-universal.dmg"
          ls -lh dist/*.dmg

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 ZIPs
    runs-on: windows-latest
    needs: [test]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Generate Wails bindings
        shell: pwsh
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP "wails-bin"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          & (Join-Path $env:GOBIN "wails3.exe") generate bindings -f "-tags sqlite_fts5,goolm" -clean=true -ts -i

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          "VERSION=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV
          "BUILD_DATE=$buildDate" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist | Out-Null

      - name: Generate Windows application resources
        shell: pwsh
        run: |
          & (Join-Path $env:RUNNER_TEMP "wails-bin\wails3.exe") generate syso `
            -arch amd64 `
            -icon build/windows/icon.ico `
            -manifest build/windows/pinger.exe.manifest `
            -out rsrc_windows_amd64.syso

      - name: Build Windows x64 binaries
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: windows
          CC: gcc
        run: |
          $ldflags = "-s -w -H windowsgui -X main.Version=$env:VERSION -X main.Commit=$env:GITHUB_SHA -X main.BuildDate=$env:BUILD_DATE"
          go build -tags "sqlite_fts5 goolm" -trimpath -buildvcs=false "-ldflags=$ldflags" -o dist/pinger.exe .
          Remove-Item rsrc_windows_amd64.syso
          go build -tags "sqlite_fts5 goolm" -trimpath -buildvcs=false "-ldflags=-s -w" -o dist/gomuks-tui.exe ./cmd/gomuks-tui
          Compress-Archive -LiteralPath dist/pinger.exe -DestinationPath "dist/Pinger-$($env:VERSION)-windows-amd64.zip"
          Compress-Archive -LiteralPath dist/gomuks-tui.exe -DestinationPath "dist/Pinger-TUI-$($env:VERSION)-windows-amd64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows]
    runs-on: macos-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: shasum -a 256 ./*.dmg ./*.zip > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
