name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test and vet
    uses: ./.github/workflows/ci.yml

  prepare-assets:
    name: Prepare application icon
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Render application icon
        run: |
          brew install librsvg
          mkdir -p dist
          rsvg-convert --width 1024 --height 1024 --output dist/gomuks-desktop.png assets/gomuks-desktop.svg

      - name: Upload application icon
        uses: actions/upload-artifact@v4
        with:
          name: application-icon
          path: dist/gomuks-desktop.png
          retention-days: 7

  build:
    name: Build macOS universal DMGs
    runs-on: macos-latest
    needs: [prepare-assets, test]
    env:
      # Matches the deployment target in build/darwin/Taskfile.yml and the
      # "macOS 12 or newer" support statement in the README.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download application icon
        uses: actions/download-artifact@v4
        with:
          name: application-icon
          path: build-assets

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Build universal macOS app
        shell: bash
        run: |
          mkdir -p "dist/Gomuks Desktop.app/Contents/MacOS" "dist/Gomuks Desktop.app/Contents/Resources" "dist/Gomuks Desktop.iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build-assets/gomuks-desktop.png \
              --out "dist/Gomuks Desktop.iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$double" "$double" build-assets/gomuks-desktop.png \
              --out "dist/Gomuks Desktop.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "dist/Gomuks Desktop.iconset" \
            -o "dist/Gomuks Desktop.app/Contents/Resources/AppIcon.icns"
          for arch in amd64 arm64; do
            clang_arch="$arch"
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CC="clang -arch $clang_arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -tags "sqlite_fts5 goolm" \
              -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}" \
              -o "dist/gomuks-desktop-${arch}" .
          done
          lipo -create dist/gomuks-desktop-amd64 dist/gomuks-desktop-arm64 \
            -output "dist/Gomuks Desktop.app/Contents/MacOS/gomuks-desktop"
          rm dist/gomuks-desktop-amd64 dist/gomuks-desktop-arm64
          lipo -info "dist/Gomuks Desktop.app/Contents/MacOS/gomuks-desktop"
          cat > "dist/Gomuks Desktop.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>gomuks-desktop</string>
            <key>CFBundleIdentifier</key><string>fi.mau.gomuks-desktop</string>
            <key>CFBundleName</key><string>Gomuks Desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist/Gomuks Desktop.app"
          codesign --verify --deep --strict "dist/Gomuks Desktop.app"

      - name: Build universal TUI binary
        shell: bash
        run: |
          for arch in amd64 arm64; do
            clang_arch="$arch"
            if [ "$arch" = amd64 ]; then clang_arch=x86_64; fi
            CC="clang -arch $clang_arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build \
              -tags "sqlite_fts5 goolm" \
              -ldflags "-s -w" \
              -o "dist/gomuks-tui-${arch}" ./cmd/gomuks-tui
          done
          lipo -create dist/gomuks-tui-amd64 dist/gomuks-tui-arm64 \
            -output dist/gomuks-tui
          rm dist/gomuks-tui-amd64 dist/gomuks-tui-arm64
          lipo -info dist/gomuks-tui

      - name: Create macOS DMGs
        shell: bash
        run: |
          set -euo pipefail
          # GUI disk image: the signed app plus an /Applications symlink so the
          # app can be dragged into place in Finder.
          gui_stage="$(mktemp -d)"
          cp -R "dist/Gomuks Desktop.app" "$gui_stage/"
          ln -s /Applications "$gui_stage/Applications"
          hdiutil create \
            -volname "Gomuks Desktop" \
            -srcfolder "$gui_stage" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "dist/Gomuks-Desktop-${VERSION}-macos-universal.dmg"
          rm -rf "$gui_stage"

          # TUI disk image: the universal binary plus a symlink into
          # /usr/local/bin so it can be dragged onto PATH in Finder.
          tui_stage="$(mktemp -d)"
          cp dist/gomuks-tui "$tui_stage/gomuks-tui"
          chmod 755 "$tui_stage/gomuks-tui"
          ln -s /usr/local/bin "$tui_stage/bin"
          hdiutil create \
            -volname "Gomuks TUI" \
            -srcfolder "$tui_stage" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "dist/Gomuks-TUI-${VERSION}-macos-universal.dmg"
          rm -rf "$tui_stage"

          hdiutil verify "dist/Gomuks-Desktop-${VERSION}-macos-universal.dmg"
          hdiutil verify "dist/Gomuks-TUI-${VERSION}-macos-universal.dmg"
          ls -lh dist/*.dmg

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: shasum -a 256 ./*.dmg > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/checksums.txt
