name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Wails bindings
        shell: bash
        run: |
          GOBIN="${RUNNER_TEMP}/wails-bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30
          "${RUNNER_TEMP}/wails-bin/wails3" generate bindings -f '-tags sqlite_fts5,goolm' -clean=true -ts -i

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build

      - name: Test
        run: go test -tags "sqlite_fts5 goolm" ./desktop ./matrix ./migration ./tui

      - name: Vet
        run: go vet -tags "sqlite_fts5 goolm" ./desktop ./matrix ./migration ./tui

      - name: Build
        run: |
          go build -tags "sqlite_fts5 goolm" .
          go build -tags "sqlite_fts5 goolm" ./cmd/gomuks-tui
