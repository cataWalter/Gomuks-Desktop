version: '3'

vars:
  APP_NAME: "pinger"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  EXTRA_TAGS: "sqlite_fts5,goolm"

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the macOS application
    cmds:
      - task: "darwin:build"

  package:
    summary: Packages a production macOS build of the application
    cmds:
      - task: "darwin:package"

  run:
    summary: Runs the macOS application
    cmds:
      - task: "darwin:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
